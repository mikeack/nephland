<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nephland — Interactive Map</title>
<meta name="description" content="Interactive map of the world of Nephland.">
<style>
:root{
  --bg:#14110d; --panel:#1d1812; --panel2:#262017; --ink:#efe6d2; --muted:#a89d86;
  --line:#3a3226; --gold:#d9a441; --ember:#d0623f; --dm:#7aa2f7; --ok:#8fbf7a;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  display:flex;flex-direction:column;min-height:100vh;line-height:1.45}
button{font:inherit;color:inherit}
a{color:var(--gold)}
.top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;gap:12px;align-items:center}
.brand h1{margin:0;font-size:1.25rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.chip{font:600 .7rem/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 8px;border-radius:99px;border:1px solid var(--dm);color:var(--dm)}
#crumbs{font-size:.95rem;color:var(--muted)}
#crumbs a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted)}
#crumbs a:hover{color:var(--gold)}
#crumbs .sep{margin:0 .45em;opacity:.6}
#crumbs .here{color:var(--gold)}

.layout{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
#wrap{position:relative;min-height:0;background:#0d0b08}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;outline:none}
#viewport.dragging{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#mapimg{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;
  box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.6)}
#pins{position:absolute;inset:0}

.pin{position:absolute;transform:translate(-50%,-50%) scale(var(--inv,1));
  background:none;border:0;padding:6px;cursor:pointer;display:block;-webkit-tap-highlight-color:transparent}
@media (pointer:coarse){.pin{padding:10px}}
.pin .dot{display:block;width:16px;height:16px;border-radius:50%;background:var(--gold);
  border:2px solid #1a140b;box-shadow:0 0 0 2px rgba(239,230,210,.85),0 2px 6px rgba(0,0,0,.6);
  transition:transform .15s}
.pin .label{position:absolute;top:calc(100% - 4px);left:50%;transform:translateX(-50%);
  font-size:.78rem;white-space:nowrap;color:#fff;font-weight:600;letter-spacing:.02em;
  text-shadow:0 0 3px #000,0 0 6px #000,0 1px 2px #000;pointer-events:none}
.pin:hover .dot,.pin:focus-visible .dot,.pin.sel .dot{transform:scale(1.35)}
.pin:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.pin.has-map .dot{background:var(--ember);width:20px;height:20px}
.pin.has-map .dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;
  border:1.5px solid var(--ember);opacity:.7;animation:pulse 2.4s ease-out infinite}
.pin .dot{position:relative}
.pin.dungeon .dot{background:#9a7bd1}
.pin.tavern .dot,.pin.shop .dot{background:var(--ok)}
.pin.landmark .dot{background:#6fb7d6}
.pin.hidden-loc{opacity:.6}
.pin.hidden-loc .dot{border-style:dashed;border-color:var(--dm);background:transparent}
@keyframes pulse{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin.has-map .dot::after{animation:none}.pin .dot{transition:none}}

.ctrl{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center;z-index:5}
.ctrl button{background:rgba(29,24,18,.92);border:1px solid var(--line);border-radius:8px;
  min-width:40px;height:40px;padding:0 12px;cursor:pointer;font-size:1.05rem}
.ctrl button:hover{border-color:var(--gold);color:var(--gold)}
.ctrl button[hidden]{display:none}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{background:rgba(29,24,18,.92);border:1px solid var(--line);border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:1.2rem}
.zoom button:hover{border-color:var(--gold);color:var(--gold)}

#tip{position:absolute;z-index:8;max-width:260px;pointer-events:none;background:var(--panel2);
  border:1px solid var(--gold);border-radius:var(--radius);padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.6);font-size:.88rem}
#tip strong{display:block;color:var(--gold);margin-bottom:2px}
#tip .t-desc{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
#tip .t-hint{display:block;margin-top:6px;color:var(--muted);font-size:.78rem;font-style:italic}
#tip[hidden],#toast[hidden],#card[hidden],#empty[hidden],.chip[hidden]{display:none}
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:9;background:var(--panel2);
  border:1px solid var(--dm);border-radius:8px;padding:8px 14px;font:.82rem/1.3 ui-monospace,Menlo,monospace}

#side{background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto;min-height:0}
#side h2{margin:0 0 12px;font-size:1.2rem;color:var(--gold)}
#side h3{margin:20px 0 8px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#places{list-style:none;margin:0;padding:0}
#places li{margin:0}
#places button{width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;
  cursor:pointer;display:flex;gap:10px;align-items:center}
#places button:hover,#places li.sel button{background:var(--panel2)}
#places .sw{width:10px;height:10px;border-radius:50%;background:var(--gold);flex:none}
#places .has-map .sw{background:var(--ember)}
#places .go{margin-left:auto;color:var(--muted);font-size:.8rem}
#places .hid .sw{background:transparent;border:1.5px dashed var(--dm)}
#places .hid{opacity:.75}
#empty,.hint{color:var(--muted);font-size:.88rem}
#card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:6px}
#card h4{margin:0 0 4px;font-size:1.1rem;color:var(--ink)}
#card .kind{font:600 .68rem/1 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#card p{margin:10px 0}
#card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-block;text-decoration:none;cursor:pointer;background:var(--ember);color:#fff;border:0;
  border-radius:8px;padding:9px 14px;font-size:.92rem}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:hover{filter:brightness(1.12)}
#card .dmbox{margin-top:12px;padding:10px;border:1px dashed var(--dm);border-radius:8px;font-size:.84rem;color:var(--ink)}
#card .dmbox code{font:.8rem ui-monospace,Menlo,monospace;color:var(--dm)}
.x{float:right;background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem}

#fatal{padding:40px 20px;max-width:560px;margin:auto}
#fatal code{background:var(--panel2);padding:2px 6px;border-radius:4px}

@media (max-width:820px){
  .layout{grid-template-columns:1fr;grid-template-rows:auto auto}
  #wrap{height:clamp(280px,72vw,62vh)}
  #side{border-left:0;border-top:1px solid var(--line)}
  .pin .label{display:none}
  #stage.zoomed .pin .label,.pin.sel .label{display:block}
}

#globe{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#globe.dragging{cursor:grabbing}
#gpins{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#gpins .pin{pointer-events:auto;left:0;top:0}
@media (max-width:820px){#gpins.zoomed .pin .label{display:block}}

[hidden]{display:none!important}
.tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tab{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--muted);text-decoration:none;font-size:.9rem}
.tab:hover{color:var(--ink)}
.tab.on{border-color:var(--gold);color:var(--gold)}
.pill{font:600 .78rem/1 system-ui,sans-serif;padding:7px 11px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.pill:hover{border-color:var(--gold)}
#calview{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:18px 16px 40px}
#calview h2{margin:0;font-size:1.5rem;color:var(--gold)}
#calview h3{margin:22px 0 8px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.calhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.calnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.calnav .btn{padding:7px 12px}
.calnav input{width:5.2em;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit}
.sub{color:var(--muted);font-size:.92rem;margin:4px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-left:4px solid var(--sc,var(--line));border-radius:var(--radius);padding:11px 12px;position:relative}
.tile:hover{border-color:var(--gold);background:var(--panel2)}
.tile b{display:block;font-size:1.02rem}
.tile small{color:var(--muted);font:.72rem system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.tile.sp{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(217,164,65,.12),var(--panel))}
.tile.now{outline:2px solid var(--gold)}
.tile .dots{position:absolute;right:10px;top:10px;color:var(--gold);font-size:.8rem}
[data-season="Spring"]{--sc:#8fbf7a}[data-season="Summer"]{--sc:#d9a441}
[data-season="Autumn"]{--sc:#d0623f}[data-season="Winter"]{--sc:#6fb7d6}
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:12px}
.wd{text-align:center;font:600 .68rem system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2px 0;overflow:hidden;text-overflow:ellipsis}
.day{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;
  min-height:58px;padding:7px 8px;position:relative}
.day:hover{border-color:var(--gold)}
.day.sel{border-color:var(--gold);background:var(--panel2)}
.day.now{box-shadow:0 0 0 2px var(--gold)}
.day .ev{position:absolute;left:8px;right:6px;bottom:5px;font:.68rem/1.2 system-ui,sans-serif;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.hv{border-style:dashed;border-color:var(--dm)}
.feast{grid-column:1/-1;text-align:center;text-decoration:none;color:var(--gold);padding:12px;border-radius:8px;
  border:1px solid var(--gold);background:linear-gradient(90deg,rgba(217,164,65,.08),rgba(217,164,65,.2),rgba(217,164,65,.08))}
.feast:hover{filter:brightness(1.15)}
.feast.now{box-shadow:0 0 0 2px var(--gold)}
.evcard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.evcard h4{margin:0 0 2px;font-size:1.05rem}
.evcard .kind{font:600 .68rem/1 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.evcard p{margin:8px 0}
.evcard.hv{border:1px dashed var(--dm)}
.evcard .dmbox{margin-top:10px;padding:9px;border:1px dashed var(--dm);border-radius:8px;font-size:.84rem}
.evcard .dmbox code{font:.8rem ui-monospace,Menlo,monospace;color:var(--dm)}
.lead{max-width:62ch;margin:10px 0}
@media (max-width:820px){
  .mgrid{gap:4px}.day{min-height:50px;padding:5px 6px}.day .ev{display:none}.day.has::after{content:"•";position:absolute;right:6px;bottom:3px;color:var(--gold)}
  .wd{font-size:.58rem;letter-spacing:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1 id="title">Nephland</h1><span id="mode" class="chip" hidden>DM preview · not published</span></div>
  <nav id="crumbs" aria-label="Map location"></nav>
  <div class="tabs" id="tabs" hidden>
    <a class="tab on" id="tabMap" href="#">Map</a>
    <a class="tab" id="tabGlobe" href="#globe" hidden>Globe</a>
    <a class="tab" id="tabCal" href="#calendar">Calendar</a>
    <a class="pill" id="todayPill" href="#calendar" hidden></a>
  </div>
</header>
<div class="layout">
  <div id="wrap">
    <div id="viewport" tabindex="0" aria-label="Interactive map. Drag to pan, scroll or pinch to zoom.">
      <div id="stage"><img id="mapimg" alt="" draggable="false"><div id="pins"></div></div>
    </div>
    <canvas id="globe" tabindex="0" aria-label="Globe. Drag to spin, scroll or pinch to zoom." hidden></canvas>
    <div id="gpins" hidden></div>
    <div class="ctrl"><button id="back" hidden>← Back</button></div>
    <div class="zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zreset" aria-label="Reset view">⌂</button>
    </div>
    <div id="tip" role="tooltip" hidden></div>
    <div id="toast" hidden></div>
  </div>
  <aside id="side">
    <h2 id="mapTitle"></h2>
    <div id="card" hidden></div>
    <h3>Places on this map</h3>
    <ul id="places"></ul>
    <p id="empty" hidden>Nothing discovered here yet.</p>
    <p class="hint" id="hint">Drag to pan. Scroll or pinch to zoom. Glowing red pins open a closer map.</p>
  </aside>
</div>
<main id="calview" hidden aria-label="Calendar"></main>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const els = {vp:$('#viewport'),stage:$('#stage'),img:$('#mapimg'),pins:$('#pins'),tip:$('#tip'),toast:$('#toast'),
  crumbs:$('#crumbs'),back:$('#back'),title:$('#title'),mode:$('#mode'),list:$('#places'),card:$('#card'),
  empty:$('#empty'),mapTitle:$('#mapTitle'),wrap:$('#wrap')};
let data, maps, cur, isDM = false, pendingLoc = null, cal = null, tiles = [], globeMode = false;
let view = {s:1,x:0,y:0};
const MAX = 8;
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));

function fatal(msg){
  document.body.innerHTML = '<div id="fatal"><h1>Map not available</h1><p>'+msg+'</p></div>';
}

/* ---------- view transform ---------- */
function apply(){
  const vw = els.vp.clientWidth, vh = els.vp.clientHeight;
  const sw = els.stage.offsetWidth*view.s, sh = els.stage.offsetHeight*view.s;
  view.x = sw <= vw ? (vw-sw)/2 : clamp(view.x, vw-sw, 0);
  view.y = sh <= vh ? (vh-sh)/2 : clamp(view.y, vh-sh, 0);
  els.stage.style.transform = 'translate('+view.x+'px,'+view.y+'px) scale('+view.s+')';
  els.stage.style.setProperty('--inv', String(1/view.s));
  els.stage.classList.toggle('zoomed', view.s >= 1.8);
}
function fit(){
  const vw = els.vp.clientWidth, vh = els.vp.clientHeight;
  const ar = (els.img.naturalWidth||4)/(els.img.naturalHeight||3);
  els.stage.style.width = Math.max(50, Math.min(vw, vh*ar)) + 'px';
  apply();
  if(globeMode) G.open(cur, els.img);
  if(pendingLoc){ const l = pendingLoc; pendingLoc = null; select(l,true); }
}
function zoomAt(cx,cy,f){
  const ns = clamp(view.s*f,1,MAX), k = ns/view.s;
  view.x = cx-(cx-view.x)*k; view.y = cy-(cy-view.y)*k; view.s = ns;
  apply(); hideTip();
}
function zoomCenter(f){ zoomAt(els.vp.clientWidth/2, els.vp.clientHeight/2, f); }
function centerOn(l){
  view.s = Math.max(view.s, 2.5);
  const px = l.x/100*els.stage.offsetWidth*view.s, py = l.y/100*els.stage.offsetHeight*view.s;
  view.x = els.vp.clientWidth/2-px; view.y = els.vp.clientHeight/2-py; apply();
}

/* ---------- pointer: pan / pinch ---------- */
const ptrs = new Map(); let drag = null, pinchD = 0, moved = false;
els.vp.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size === 1){ drag = {x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; moved = false; }
  else if(ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinchD = Math.hypot(a.x-b.x,a.y-b.y); moved = true; }
});
window.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size === 2){
    const [a,b] = [...ptrs.values()], d = Math.hypot(a.x-b.x,a.y-b.y), r = els.vp.getBoundingClientRect();
    if(pinchD > 0) zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/pinchD);
    pinchD = d; return;
  }
  if(drag && ptrs.size === 1){
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    if(!moved && Math.hypot(dx,dy) > 5){ moved = true; els.vp.classList.add('dragging'); hideTip(); }
    if(moved){ view.x = drag.vx+dx; view.y = drag.vy+dy; apply(); }
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId); pinchD = 0;
  if(ptrs.size === 0){ drag = null; els.vp.classList.remove('dragging'); setTimeout(()=>{moved = false},0); }
  else if(ptrs.size === 1){ const p = [...ptrs.values()][0]; drag = {x:p.x,y:p.y,vx:view.x,vy:view.y}; }
}
window.addEventListener('pointerup', endPtr);
window.addEventListener('pointercancel', endPtr);
els.vp.addEventListener('wheel', e => {
  e.preventDefault();
  const r = els.vp.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-e.deltaY*0.0015));
},{passive:false});
$('#zin').onclick = () => globeMode ? G.zoom(1.5) : zoomCenter(1.5);
$('#zout').onclick = () => globeMode ? G.zoom(1/1.5) : zoomCenter(1/1.5);
$('#zreset').onclick = () => { if(globeMode) return G.reset(); view = {s:1,x:0,y:0}; apply(); };
window.addEventListener('resize', () => { fit(); hideTip(); });

/* DM helper: shift-click empty map to copy coordinates for locations.json.
   The local pin editor (nephland.py edit) also hooks plain clicks here. */
const hooks = {};
els.vp.addEventListener('click', e => {
  if(!isDM || moved || e.target.closest('.pin')) return;
  const r = els.stage.getBoundingClientRect();
  if(!e.shiftKey){
    if(hooks.mapClick) hooks.mapClick((e.clientX-r.left)/r.width*100, (e.clientY-r.top)/r.height*100);
    return;
  }
  const x = ((e.clientX-r.left)/r.width*100).toFixed(1), y = ((e.clientY-r.top)/r.height*100).toFixed(1);
  const text = '"x": '+x+', "y": '+y;
  if(navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
  els.toast.textContent = text + '  (copied)'; els.toast.hidden = false;
  clearTimeout(showToast.t); showToast.t = setTimeout(()=>{els.toast.hidden = true},3500);
});
function showToast(){}

/* ---------- tooltip ---------- */
function hideTip(){ els.tip.hidden = true; }
function showTip(pin,l){
  els.tip.textContent = '';
  const h = document.createElement('strong'); h.textContent = l.name; els.tip.appendChild(h);
  if(l.description){ const d = document.createElement('span'); d.className = 't-desc'; d.textContent = l.description; els.tip.appendChild(d); }
  const hint = document.createElement('span'); hint.className = 't-hint';
  hint.textContent = (isDM && !l.revealed ? 'Hidden from players. ' : '') + (l.opens ? 'Click to open its map' : '');
  if(hint.textContent) els.tip.appendChild(hint);
  els.tip.hidden = false;
  const w = els.wrap.getBoundingClientRect(), r = pin.querySelector('.dot').getBoundingClientRect();
  const tw = els.tip.offsetWidth, th = els.tip.offsetHeight;
  let left = clamp(r.left-w.left+r.width/2-tw/2, 8, Math.max(8,w.width-tw-8));
  let top = r.top-w.top-th-14; if(top < 8) top = r.bottom-w.top+14;
  els.tip.style.left = left+'px'; els.tip.style.top = top+'px';
}

/* ---------- card ---------- */
function closeCard(){ els.card.hidden = true; markSel(null); }
function markSel(id){
  document.querySelectorAll('.pin').forEach(p => p.classList.toggle('sel', p.dataset.id === id));
  document.querySelectorAll('#places li').forEach(li => li.classList.toggle('sel', li.dataset.id === id));
}
function renderCard(l){
  const c = els.card; c.textContent = '';
  const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.setAttribute('aria-label','Close'); x.onclick = closeCard;
  const kind = document.createElement('div'); kind.className = 'kind'; kind.textContent = (l.type || 'place') + (isDM && !l.revealed ? ' · hidden from players' : '');
  const h = document.createElement('h4'); h.textContent = l.name;
  c.append(x,kind,h);
  if(l.description){ const p = document.createElement('p'); p.textContent = l.description; c.appendChild(p); }
  const row = document.createElement('div'); row.className = 'row';
  if(l.opens && maps[l.opens]){

/* ---------- globe ----------

   one full-canvas quad, and the fragment shader finds where each pixel's ray meets the sphere.
   Only the real map image is drawn. Everything off the sheet is open sea in the map's own colour.
   Where the sheet sits comes from the map's optional "globe" setting in maps.json:

    pinsEl.textContent = ''; pins = [];

      b.className = 'pin '+(l.type||'poi')+(opens?' has-map':'')+(hiddenLoc?' hidden-loc':'');
      b.dataset.id = l.id; b.setAttribute('aria-label', l.name + (opens ? ' (opens map)' : ''));
      const dot = document.createElement('span'); dot.className = 'dot';
      const lab = document.createElement('span'); lab.className = 'label'; lab.textContent = l.name;
      b.append(dot,lab);
      b.addEventListener('pointerenter', e => { if(e.pointerType === 'mouse' && !gp.size) showTip(b,l); });
      b.addEventListener('pointerleave', hideTip);
      b.addEventListener('focus', () => showTip(b,l));
      b.addEventListener('blur', hideTip);
      b.addEventListener('click', e => {

    });

  }

/* ---------- calendar ---------- */
const ord = n => { const v = n%100; return n+((v>=11&&v<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th')); };
function h(tag,cls,text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function calInit(c){
  cal = c; cal.M = Object.fromEntries(c.months.map(m => [m.id,m])); cal.S = Object.fromEntries(c.special_days.map(x => [x.id,x]));
  tiles = []; c.year.forEach(e => { if(e.special) tiles.push({k:'s',id:e.special}); else if(!(e.from > 1)) tiles.push({k:'m',id:e.month}); });
}
const tname = t => t.k === 's' ? cal.S[t.id].name : cal.M[t.id].name;
const tindex = t => tiles.findIndex(x => x.k === t.k && x.id === t.id);
const era = () => cal.era || '';
function dateText(y,k,id,d){ return k === 's' ? cal.S[id].name+', '+y+' '+era() : ord(d)+' of '+cal.M[id].name+', '+y+' '+era(); }

function isNow(y,k,id,d){
  const t = cal.today; if(!t || t.year !== y) return false;
  return k === 's' ? t.special === id : (t.month === id && (d == null || t.day === d));
}
const calHref = (y,id,d) => '#calendar/'+y+(id ? '/'+id : '')+(d ? '/'+d : '');

  c.appendChild(h('div','kind',(e.year ? 'One-time event' : 'Every year')+(isDM && !e.revealed ? ' · hidden from players' : '')));
  c.appendChild(h('h4',null,e.title));

  c.appendChild(h('div','sub',dateText(e.year || y,k,e.special || e.month,e.day)));

  const loc = e.location && data.locations.find(l => l.id === e.location);
  if(loc){ const a = h('a','btn alt','Show '+loc.name+' on the map'); a.href = '#'+encodeURIComponent(loc.map)+'@'+encodeURIComponent(loc.id); c.appendChild(a); }
  if(isDM){
    const d = h('div','dmbox'); d.append('id: '); d.appendChild(h('code',null,e.id));
    if(e.dm_notes){ const n = h('div',null,'DM notes: '+e.dm_notes); n.style.marginTop = '6px'; d.appendChild(n); }
    const t = h('div',null,e.revealed ? 'Hide again with:  python3 nephland.py hide '+e.id : 'Reveal with:  python3 nephland.py reveal '+e.id);
    t.style.cssText = 'margin-top:6px;color:var(--muted)'; d.appendChild(t); c.appendChild(d);
  }
  return c;
}

function yearNav(y,mid){
  const head = h('div','calhead'), l = h('div');
  l.appendChild(h('h2',null,mid || ('Year '+y+' '+era())));
  if(mid) l.appendChild(h('div','sub','Year '+y+' '+era()));
  head.appendChild(l);
  const nav = h('div','calnav');
  const p = h('a','btn alt','‹ Year '+(y-1)); p.href = calHref(Math.max(1,y-1)); if(y <= 1) p.hidden = true;
  const n = h('a','btn alt','Year '+(y+1)+' ›'); n.href = calHref(y+1);
  const f = h('form'); f.style.cssText = 'display:flex;gap:6px';
  const inp = h('input'); inp.type = 'number'; inp.min = 1; inp.max = 9999; inp.placeholder = 'Year'; inp.setAttribute('aria-label','Go to year');
  const go = h('button','btn alt','Go'); go.type = 'submit';
  f.append(inp,go); f.onsubmit = ev => { ev.preventDefault(); const v = parseInt(inp.value,10); if(v >= 1) location.hash = calHref(v); };
  nav.append(p,n,f); head.appendChild(nav); return head;
}

function renderCal(parts){
  const root = $('#calview'); root.textContent = '';
  const ty = cal.today && cal.today.year;
  const y = Math.max(1, parseInt(parts[1],10) || ty || 1);
  const id = parts[2], day = parseInt(parts[3],10) || null;
  const tile = id && (cal.M[id] ? {k:'m',id} : cal.S[id] ? {k:'s',id} : null);
  document.title = (tile ? tname(tile)+', ' : '')+'Year '+y+' — '+cal.name;
  if(!tile) return renderYear(root,y);
  if(tile.k === 'm') renderMonth(root,y,tile,day); else renderSpecial(root,y,tile);
}

function renderYear(root,y){
  root.appendChild(yearNav(y));
  if(cal.era_name) root.appendChild(h('p','sub',cal.name+' · '+cal.era_name+' ('+cal.era+')'));
  const g = h('div','tiles'); g.style.marginTop = '14px';
  tiles.forEach(t => {
    const a = h('a','tile'+(t.k === 's' ? ' sp' : '')+(isNow(y,t.k,t.id) ? ' now' : '')); a.href = calHref(y,t.id);
    if(t.k === 'm'){ a.dataset.season = cal.M[t.id].season; a.appendChild(h('b',null,cal.M[t.id].name)); a.appendChild(h('small',null,cal.M[t.id].season+' · '+cal.M[t.id].days+' days')); }
    else { a.appendChild(h('b',null,cal.S[t.id].name)); a.appendChild(h('small',null,'Special day')); }
    if(evAt(y,t.k,t.id).length) a.appendChild(h('span','dots','●'));
    g.appendChild(a);
  });
  root.appendChild(g);
  const evs = []; tiles.forEach(t => evAt(y,t.k,t.id).forEach(e => evs.push(e)));
  evs.sort((a,b) => (a.day||0)-(b.day||0));
  const byTile = (e) => tiles.findIndex(t => t.k === (e.special ? 's' : 'm') && t.id === (e.special || e.month));
  evs.sort((a,b) => byTile(a)-byTile(b) || (a.day||0)-(b.day||0));
  root.appendChild(h('h3',null,'Events in year '+y));
  if(!evs.length) root.appendChild(h('p','hint','Nothing recorded for this year.'));
  evs.forEach(e => root.appendChild(evCard(e,y)));
}

function stepper(root,y,t){
  const i = tindex(t), nav = h('div','calnav');
  const prev = i > 0 ? {y:y,t:tiles[i-1]} : (y > 1 ? {y:y-1,t:tiles[tiles.length-1]} : null);
  const next = i < tiles.length-1 ? {y:y,t:tiles[i+1]} : {y:y+1,t:tiles[0]};
  if(prev){ const a = h('a','btn alt','‹ '+tname(prev.t)); a.href = calHref(prev.y,prev.t.id); nav.appendChild(a); }
  const up = h('a','btn alt','Year '+y); up.href = calHref(y); nav.appendChild(up);
  const b = h('a','btn alt',tname(next.t)+' ›'); b.href = calHref(next.y,next.t.id); nav.appendChild(b);
  return nav;
}

function renderMonth(root,y,t,sel){
  const m = cal.M[t.id], head = h('div','calhead');
  const l = h('div'); l.appendChild(h('h2',null,m.name)); l.appendChild(h('div','sub',m.season+' · Year '+y+' '+era())); head.append(l,stepper(root,y,t));
  root.appendChild(head);
  if(m.description) root.appendChild(h('p','lead',m.description));
  const g = h('div','mgrid'); g.dataset.season = m.season;
  cal.weekdays.forEach(w => g.appendChild(h('div','wd',w)));
  const segs = cal.year.filter(e => e.month === t.id);
  const spans = []; // ordered pieces: {from,to} or {special}
  let at = 0;
  cal.year.forEach((e,i) => {
    if(e.month === t.id) spans.push({from:e.from||1,to:e.to||m.days});
    else if(e.special && spans.length && spans[spans.length-1].to < m.days && segs.length > 1 && at < segs.length) spans.push({special:e.special});
    if(e.month === t.id) at++;
  });
  const cellFor = d => {
    const evs = evAt(y,'m',t.id,d), a = h('a','day'+(isNow(y,'m',t.id,d)?' now':'')+(sel===d?' sel':'')+(evs.length?' has':'')+(isDM && evs.some(e=>!e.revealed)?' hv':''));
    a.href = calHref(y,t.id,d); a.appendChild(h('b',null,String(d)));
    if(evs.length) a.appendChild(h('span','ev',evs[0].title+(evs.length>1?' +'+(evs.length-1):'')));
    a.setAttribute('aria-label',ord(d)+' of '+m.name+(evs.length?', '+evs.length+' event'+(evs.length>1?'s':''):''));
    return a;
  };
  spans.forEach(sp => {
    if(sp.special){ const a = h('a','feast'+(isNow(y,'s',sp.special)?' now':''),cal.S[sp.special].name+' — special day'); a.href = calHref(y,sp.special); g.appendChild(a); }
    else for(let d = sp.from; d <= sp.to; d++) g.appendChild(cellFor(d));
  });
  root.appendChild(g);
  const evs = sel ? evAt(y,'m',t.id,sel) : evAt(y,'m',t.id);
  root.appendChild(h('h3',null,sel ? dateText(y,'m',t.id,sel) : 'Events this month'));
  if(!evs.length) root.appendChild(h('p','hint',sel ? 'Nothing recorded for this day.' : 'Nothing recorded this month. Pick a day to see it.'));
  evs.forEach(e => root.appendChild(evCard(e,y)));
  if(isNow(y,'m',t.id) && !sel) root.appendChild(h('p','hint','Today is highlighted.'));
}

function renderSpecial(root,y,t){
  const s = cal.S[t.id], head = h('div','calhead');
  const l = h('div'); l.appendChild(h('h2',null,s.name)); l.appendChild(h('div','sub','Special day · Year '+y+' '+era()+(isNow(y,'s',t.id)?' · Today':''))); head.append(l,stepper(root,y,t));
  root.appendChild(head);
  if(s.description) root.appendChild(h('p','lead',s.description));
  const evs = evAt(y,'s',t.id);
  root.appendChild(h('h3',null,'Events'));
  if(!evs.length) root.appendChild(h('p','hint','Nothing recorded for this day.'));
  evs.forEach(e => root.appendChild(evCard(e,y)));
}

function setupTabs(){
  $('#tabs').hidden = false;
  $('#tabCal').hidden = !cal;
  $('#tabGlobe').hidden = !G.ok;
  const t = cal && cal.today;
  if(t){
    const k = t.special ? 's' : 'm', id = t.special || t.month;
    const p = $('#todayPill'); p.hidden = false; p.textContent = 'Today · '+dateText(t.year,k,id,t.day);
    p.href = calHref(t.year,id,t.day);
  }
}

const getJSON = u => fetch(u).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); });
getJSON('data/map-data.json').then(d => {
  data = d; maps = Object.fromEntries(d.maps.map(m => [m.id,m])); isDM = d.mode === 'dm';
  els.title.textContent = d.title; els.mode.hidden = !isDM;
  if(isDM) window.nephland = {
    hooks, els,
    get data(){ return data; }, get cur(){ return cur; },
    reload(d2){ data = d2; maps = Object.fromEntries(d2.maps.map(m => [m.id,m])); renderPins(); },
    select(id){ const l = data.locations.find(x => x.id === id && x.map === cur.id); if(l) select(l,false); else closeCard(); },
    closeCard
  };
  if(isDM) window.dispatchEvent(new Event('nephland:ready'));
  return getJSON('data/calendar-data.json').then(calInit, () => { cal = null; });
}).then(() => { setupTabs(); route(); })
.catch(() => fatal('Could not load the map data. If you opened this file directly, run <code>python3 nephland.py serve</code> instead and visit http://localhost:8000.'));
})();
</script>
